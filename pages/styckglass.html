<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styckglass | Sockerkickslandet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Henny+Penny" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Londrina+Solid" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Michroma" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <header class="header">
        <a href="../index.html" class="logo-link">
            <h1 class="h1">Sockerkickslandet</h1>
            <h4 class="h4">Godis för den goda smakens skull</h4>
        </a>
    </header>

    <main>
        <!-- SIA GLASS -->
        <h2 class="section-title">SIA GLASS</h2>
        <div class="carousel-wrapper">
            <button class="scroll-btn left">&lt;</button>
            <div class="image-row">
                <div class="product-group">
                    <div class="product-images">
                        <img src="../images/styckglass/sia-sandwich.png" alt="SIA Sandwich" onerror="this.src='https://via.placeholder.com/150x250?text=SIA+Sandwich'">
                    </div>
                    <p class="product-text">Sandwich</p>
                </div>
            </div>
            <button class="scroll-btn right">&gt;</button>
        </div>

        <!-- GB GLACE -->
        <h2 class="section-title">GB GLACE</h2>
        <div class="carousel-wrapper">
            <button class="scroll-btn left">&lt;</button>
            <div class="image-row">
                <div class="product-group">
                    <div class="product-images">
                        <img src="../images/styckglass/88an.png" alt="88an" onerror="this.src='https://via.placeholder.com/150x250?text=88an'">
                    </div>
                    <p class="product-text">88an</p>
                </div>
                <div class="product-group">
                    <div class="product-images">
                        <img src="../images/styckglass/daimstrut.png" alt="Daimstrut" onerror="this.src='https://via.placeholder.com/150x250?text=Daimstrut'">
                    </div>
                    <p class="product-text">Daimstrut</p>
                </div>
            </div>
            <button class="scroll-btn right">&gt;</button>
        </div>

        <!-- MAGNUM -->
        <h2 class="section-title">MAGNUM</h2>
        <div class="carousel-wrapper">
            <button class="scroll-btn left">&lt;</button>
            <div class="image-row">
                <div class="product-group">
                    <div class="product-images">
                        <img src="../images/styckglass/magnum-classic.png" alt="Magnum Classic" onerror="this.src='https://via.placeholder.com/150x250?text=Magnum+Classic'">
                    </div>
                    <p class="product-text">Magnum Classic</p>
                </div>
                <div class="product-group">
                    <div class="product-images">
                        <img src="../images/styckglass/magnum-almond.png" alt="Magnum Almond" onerror="this.src='https://via.placeholder.com/150x250?text=Magnum+Almond'">
                    </div>
                    <p class="product-text">Magnum Almond</p>
                </div>
            </div>
            <button class="scroll-btn right">&gt;</button>
        </div>
    </main>

    <footer class="recfooter"></footer>

    <script src="../JS/script.js"></script>
</body>
</html>
